# デスクトップ版(Windows)を作って確かめる
#
# 作るもの: PackagingTool.exe(成果物 "PackagingTool-windows" から取れる)。
# 配るときは、ツールのフォルダの直下に置いてから scripts\make_dist.bat を流す
# (make_dist が「梱包資材総合ツール.exe」の名前で入れる)。
#
# 確かめること:
#   - Python の試験(Windows の上で。標準入出力のやりとりは OS で違いが出やすい)
#   - Rust の試験
#   - 作った exe を本当に起動し、画面が Python から届くこと・ポートで待ち受けないこと・
#     止めたら Python も終わること(scripts/desktop_smoke.py)
name: デスクトップ版(Windows)

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Python の部品を入れる
        run: python -m pip install -r requirements.txt pytest

      - name: Python の試験
        env:
          PYTHONIOENCODING: utf-8
        run: python -m pytest -q -p no:cacheprovider

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Rust の試験
        working-directory: src-tauri
        run: cargo test --release

      - name: exe を作る
        working-directory: src-tauri
        run: cargo build --release

      - name: 作った exe を起動して確かめる
        env:
          PYTHONIOENCODING: utf-8
        run: python scripts/desktop_smoke.py --exe src-tauri/target/release/PackagingTool.exe

      - uses: actions/upload-artifact@v4
        with:
          name: PackagingTool-windows
          path: src-tauri/target/release/PackagingTool.exe
          if-no-files-found: error
